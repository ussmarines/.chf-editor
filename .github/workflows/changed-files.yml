name: Changed files

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: changed-files-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Changed file hygiene
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - name: Select changed paths
        id: paths
        shell: bash
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
            git fetch --no-tags --depth=1 origin "$base" "$GITHUB_SHA"
            git checkout --detach FETCH_HEAD
            paths="$(git diff --name-only "$base...HEAD")"
          elif [[ "$GITHUB_EVENT_BEFORE" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
            git checkout --detach FETCH_HEAD
            paths="$(git diff-tree --root --no-commit-id --name-only -r "$GITHUB_SHA")"
          else
            before="$GITHUB_EVENT_BEFORE"
            if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
              git checkout --detach FETCH_HEAD
              before="$(git rev-parse "$GITHUB_SHA^1")"
            else
              git fetch --no-tags --depth=1 origin "$before" "$GITHUB_SHA"
              git checkout --detach "$GITHUB_SHA"
            fi
            paths="$(git diff --name-only "$before" "$GITHUB_SHA")"
          fi
          printf '%s\n' "$paths" > "$RUNNER_TEMP/changed-paths.txt"
          if [[ -n "$paths" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whitespace in changed files
        if: steps.paths.outputs.has_changes == 'true'
        shell: bash
        run: |
          mapfile -t paths < "$RUNNER_TEMP/changed-paths.txt"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
            git diff --check "$base...HEAD" -- "${paths[@]}"
          else
            before="$GITHUB_EVENT_BEFORE"
            if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              if before="$(git rev-parse "$GITHUB_SHA^1" 2>/dev/null)"; then
                git diff --check "$before" "$GITHUB_SHA" -- "${paths[@]}"
              else
                git diff-tree --check --root --no-commit-id -r "$GITHUB_SHA" -- "${paths[@]}"
              fi
            else
              git diff --check "$before" "$GITHUB_SHA" -- "${paths[@]}"
            fi
          fi

      - name: Reject private or generated artifacts in changed paths
        if: steps.paths.outputs.has_changes == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          paths = [Path(line) for line in Path(__import__("os").environ["RUNNER_TEMP"], "changed-paths.txt").read_text().splitlines() if line]
          forbidden_suffixes = {".chf", ".mp4", ".mov", ".mkv", ".avi", ".webm", ".png", ".jpg", ".jpeg", ".gif", ".bmp", ".tif", ".tiff", ".webp", ".exr", ".p4k", ".dcb", ".zip", ".7z", ".rar", ".pdf"}
          forbidden_parts = {"outputs", "private", "graphify-out", "__pycache__", ".venv", "venv"}
          failures = []
          for path in paths:
              if (any(part.lower() in forbidden_parts for part in path.parts)
                      or path.suffix.lower() in forbidden_suffixes
                      or path.name.lower().endswith(".experiment.json")):
                  failures.append(f"private/generated path: {path}")
                  continue
              if not path.is_file():
                  continue
              if path.stat().st_size > 2_000_000:
                  failures.append(f"changed file exceeds content-scan limit: {path}")
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except (UnicodeError, OSError):
                  failures.append(f"changed file is not readable UTF-8 text: {path}")
                  continue
              if "\x00" in content:
                  failures.append(f"binary content in changed file: {path}")
                  continue
              if re.search(r"\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b", content, re.IGNORECASE):
                  failures.append(f"email address in {path}")
              if re.search(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----", content):
                  failures.append(f"private key in {path}")
              if re.search(r"\bgh[pousr]_[A-Za-z0-9_]{20,}\b", content):
                  failures.append(f"GitHub token in {path}")
          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)
          print(f"Checked {len(paths)} changed paths")
          PY
